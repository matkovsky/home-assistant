blueprint:
  name: Switch → Light control (single/double/hold)
  description: >
    Single push toggles the selected light(s) as a group. Double push sets a
    fixed brightness/color temperature. Holding the button dims up and down
    between min and max; releasing keeps the current level. Requires a Shelly
    input in button mode exposing long_push and btn_up events. Optionally
    power-cycles the lights through their relay when they stay unavailable.
    Version 1.1.
  domain: automation
  author: Peter Matkovsky
  source_url: https://github.com/matkovsky/home-assistant/blob/main/blueprints/automation/switch_light_control.yaml
  input:
    switch_event:
      name: Switch input
      description: Event entity of the switch input (Shelly input in detached mode)
      selector:
        entity:
          filter:
            - domain: event
    lights:
      name: Light(s)
      description: When dimming, the first light's brightness is the starting point.
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    double_push_settings:
      name: Double push scene
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        brightness_pct:
          name: Brightness
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
        color_temp_kelvin:
          name: Color temperature
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        transition:
          name: Transition
          default: 2
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: s
    hold_settings:
      name: Hold-to-dim
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        dim_min:
          name: Minimum brightness
          default: 5
          selector:
            number: {min: 1, max: 99, unit_of_measurement: "%", mode: slider}
        dim_max:
          name: Maximum brightness
          default: 100
          selector:
            number: {min: 2, max: 100, unit_of_measurement: "%", mode: slider}
        dim_step:
          name: Step size
          default: 5
          selector:
            number: {min: 1, max: 25, unit_of_measurement: "%"}
        dim_interval:
          name: Step interval
          description: Time between steps. 300–500 ms is a good range for Zigbee lights.
          default: 400
          selector:
            number: {min: 150, max: 2000, step: 50, unit_of_measurement: ms}
        dim_max_steps:
          name: Safety limit (steps)
          description: Stops the loop if the release event is ever missed.
          default: 75
          selector:
            number: {min: 10, max: 300}
    maintenance_settings:
      name: Maintenance
      icon: mdi:wrench
      collapsed: true
      input:
        auto_restart_enabled:
          name: Auto-restart unavailable lights
          description: >
            Cuts power to the light fixture through the power switch below when
            any of the lights stays unavailable. Does nothing until a power
            switch is selected.
          default: true
          selector:
            boolean:
        power_switch:
          name: Power switch
          description: >
            The relay that physically powers the light fixture, for example the
            Shelly output in detached mode. It is turned off and back on to
            restart the lights.
          default: ""
          selector:
            entity:
              filter:
                - domain: switch
        unavailable_for:
          name: Unavailable for
          description: How long a light must be unavailable before it is restarted.
          default: 60
          selector:
            number: {min: 10, max: 3600, unit_of_measurement: s}
        power_off_duration:
          name: Power-off duration
          description: How long the power stays cut during each restart.
          default: 2
          selector:
            number: {min: 1, max: 30, unit_of_measurement: s}
        recovery_timeout:
          name: Recovery timeout
          description: >
            How long to wait for the lights to come back online after a
            restart. If they don't, the restart is repeated.
          default: 60
          selector:
            number: {min: 10, max: 600, unit_of_measurement: s}
        max_retries:
          name: Retries
          description: >
            How many more times to restart if the first restart doesn't help.
            When all attempts fail, a persistent notification is shown.
          default: 3
          selector:
            number: {min: 0, max: 10}

trigger_variables:
  tv_lights: !input lights
  tv_enabled: !input auto_restart_enabled
  tv_switch: !input power_switch

variables:
  lights: !input lights
  lights_list: "{{ lights if lights is list else [lights] }}"
  min_pct: !input dim_min
  max_pct: !input dim_max
  step_pct: !input dim_step
  interval_ms: !input dim_interval
  max_steps: !input dim_max_steps
  restart_enabled: !input auto_restart_enabled
  power_switch: !input power_switch
  unavailable_s: !input unavailable_for
  power_off_s: !input power_off_duration
  recovery_s: !input recovery_timeout
  max_retries: !input max_retries
  notification_id: "light_auto_restart_{{ this.entity_id }}"

triggers:
  - trigger: event.received
    target:
      entity_id: !input switch_event
    options:
      event_type: [single_push]
    id: SINGLE
  - trigger: event.received
    target:
      entity_id: !input switch_event
    options:
      event_type: [double_push]
    id: DOUBLE
  - trigger: event.received
    target:
      entity_id: !input switch_event
    options:
      event_type: [long_push]
    id: LONG
  - trigger: template
    value_template: >
      {{ tv_enabled and tv_switch not in ['', none]
         and (tv_lights if tv_lights is list else [tv_lights])
             | select('is_state', 'unavailable') | list | count > 0 }}
    for:
      seconds: !input unavailable_for
    id: UNAVAILABLE
  # A template trigger doesn't fire when it's already true at startup, e.g.
  # lights that never came back after a power outage. This covers that case.
  - trigger: homeassistant
    event: start
    id: STARTUP

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: SINGLE
        sequence:
          - if:
              - condition: state
                entity_id: !input lights
                state: "on"
                match: any
            then:
              - action: light.turn_off
                target:
                  entity_id: !input lights
            else:
              - action: light.turn_on
                target:
                  entity_id: !input lights

      - conditions:
          - condition: trigger
            id: DOUBLE
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data:
              brightness_pct: !input brightness_pct
              color_temp_kelvin: !input color_temp_kelvin
              transition: !input transition

      - conditions:
          - condition: trigger
            id: LONG
        sequence:
          - variables:
              ref_light: "{{ lights[0] if lights is list else lights }}"
              span: "{{ max_pct - min_pct }}"
              start: >
                {% set b = state_attr(ref_light, 'brightness') %}
                {% if is_state(ref_light, 'on') and b %}
                  {{ [[(b | int / 2.55) | round(0) | int, min_pct] | max, max_pct] | min }}
                {% else %}
                  {{ min_pct }}
                {% endif %}
          - repeat:
              sequence:
                - variables:
                    x: "{{ (start - min_pct + repeat.index * step_pct) % (2 * span) }}"
                    level: "{{ min_pct + (x if x <= span else 2 * span - x) }}"
                - action: light.turn_on
                  target:
                    entity_id: !input lights
                  data:
                    brightness_pct: "{{ level }}"
                    transition: "{{ interval_ms / 1000 }}"
                - wait_for_trigger:
                    - trigger: event.received
                      target:
                        entity_id: !input switch_event
                      options:
                        event_type: [btn_up]
                  timeout:
                    milliseconds: "{{ interval_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= max_steps }}"

      - conditions:
          - condition: trigger
            id: [UNAVAILABLE, STARTUP]
          - condition: template
            value_template: "{{ restart_enabled and power_switch not in ['', none] }}"
        sequence:
          - if:
              - condition: trigger
                id: STARTUP
            then:
              - delay:
                  seconds: "{{ unavailable_s }}"
          # Only act on lights that have been unavailable for the full period.
          # This also stops the startup run from duplicating a restart that the
          # UNAVAILABLE trigger already started.
          - condition: template
            value_template: >
              {% set ns = namespace(stale=false) %}
              {% for l in lights_list %}
                {% if is_state(l, 'unavailable')
                      and (now() - states[l].last_changed).total_seconds() >= unavailable_s - 1 %}
                  {% set ns.stale = true %}
                {% endif %}
              {% endfor %}
              {{ ns.stale }}
          - variables:
              was_on: "{{ lights_list | select('is_state', 'on') | list | count > 0 }}"
          - repeat:
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: "{{ power_switch }}"
                - delay:
                    seconds: "{{ power_off_s }}"
                - action: switch.turn_on
                  target:
                    entity_id: "{{ power_switch }}"
                - wait_template: >
                    {{ lights_list | select('is_state', 'unavailable') | list | count == 0 }}
                  timeout:
                    seconds: "{{ recovery_s }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.completed or repeat.index > max_retries }}"
          - if:
              - condition: template
                value_template: >
                  {{ lights_list | select('is_state', 'unavailable') | list | count == 0 }}
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_id }}"
              # Bulbs often switch themselves on after power returns, so put the
              # group back the way it was before the restart.
              - delay:
                  seconds: 2
              - if:
                  - condition: template
                    value_template: "{{ was_on }}"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights_list }}"
                else:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights_list }}"
            else:
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: Lights still unavailable
                  message: >
                    {{ lights_list | select('is_state', 'unavailable')
                       | map('state_attr', 'friendly_name') | join(', ') }}
                    stayed unavailable after {{ (max_retries | int) + 1 }}
                    power cycle(s) via
                    {{ state_attr(power_switch, 'friendly_name') or power_switch }}
                    ({{ this.attributes.friendly_name }}).

# parallel so a restart that takes minutes doesn't block the button, and the
# button doesn't swallow a restart trigger.
mode: parallel
max: 10
max_exceeded: silent